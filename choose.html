<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>选择 LANX 电脑</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#11151d;color:#f0f3fa}
body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(660px,calc(100% - 40px));padding:44px 0}
.eyebrow{font-size:12px;letter-spacing:.13em;color:#85a4e8}h1{font-size:30px;margin:12px 0}p{color:#abb8cd;line-height:1.7}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0}a{display:block;padding:24px;color:inherit;background:#1b2434;border:1px solid #35435c;border-radius:16px;text-decoration:none}
a:hover,a:focus-visible{border-color:#83a9ff;outline:2px solid #83a9ff;outline-offset:3px}h2{font-size:20px;margin:0 0 8px}.status{font-size:13px;color:#a7bdec}.open{display:block;color:#a5c1ff;margin-top:22px}
.note{font-size:13px}.note a{display:inline;padding:0;border:0;background:none;color:#a5c1ff}@media(max-width:520px){.cards{grid-template-columns:1fr}h1{font-size:26px}}
</style>
</head>
<body><main>
<span class="eyebrow">LANX · 开发工作台</span>
<h1>选择要操作的电脑</h1>
<p>两个入口各自连接一台 Windows 电脑，登录后即可操作对应工作台。</p>
<div class="cards">
<a id="pc1" href="https://duanzhenjiang.github.io/lanx-go/" rel="noopener"><h2>电脑一 · 原电脑</h2><span id="status1" class="status">正在检查入口</span><span class="open">进入电脑一 →</span></a>
<a id="pc2" href="https://duanzhenjiang.github.io/lanx-go/pc2/" rel="noopener"><h2>电脑二 · 新电脑</h2><span id="status2" class="status">正在检查入口</span><span class="open">进入电脑二 →</span></a>
</div>
<p class="note">编译服务器由两台电脑共用；操作 Hiklink、浏览器和本机文件时，请选择对应电脑。每台工作台仍需自己的访问口令。</p>
<p class="note">入口状态表示是否已发布网址，实际在线情况以打开后的连接结果为准。</p>
</main><script>
for(const [repo,id] of [['lanx-go','status1'],['lanx-go1','status2']]){
  fetch('https://api.github.com/repos/duanzhenjiang/'+repo+'/contents/url.json?ref=main&cb='+Date.now(),{cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'}})
    .then(r=>{if(!r.ok)throw Error();return r.json()})
    .then(d=>{document.getElementById(id).textContent=d&&/^https:\/\/[a-z0-9.-]+$/i.test(d.url||'')?'访问网址已发布':'等待电脑发布访问网址'})
    .catch(()=>{document.getElementById(id).textContent='暂时无法确认，可点击入口重试'});
}
</script></body></html>
