<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LANX 远程入口</title>
<style>
:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:#15171c;color:#e6e8ec;font:15px/1.7 -apple-system,"Segoe UI",system-ui,sans-serif}
main{max-width:420px;padding:28px;text-align:center}
h1{font-size:19px;margin:0 0 12px}
a{color:#6ea8fe;word-break:break-all}
.t{color:#9aa0a8;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<main>
<h1>正在连接 LANX…</h1>
<p id="msg">正在获取这台电脑的最新访问网址，请稍候。</p>
<p><a id="go" href="https://elect-metro-quebec-roughly.trycloudflare.com" rel="noopener">手动打开最新网址</a></p>
<p class="t">这是固定书签，会自动跳到最新地址；打开后仍需输入访问口令。</p>
</main>
<script>
(function(){
var owner="duanzhenjiang",repo="lanx-go1",branch="main",baked="https://elect-metro-quebec-roughly.trycloudflare.com";
var go=document.getElementById("go"),msg=document.getElementById("msg");
function ok(u){return typeof u==="string"&&/^https:\/\/[a-z0-9.-]+/i.test(u);}
function jump(u){if(ok(u)){go.href=u;location.replace(u);return true;}return false;}
var api="https://raw.githubusercontent.com/"+owner+"/"+repo+"/"+branch+"/url.json?cb="+Date.now();
function read(u){var c=new AbortController(),t=setTimeout(function(){c.abort();},4000);
return fetch(u,{cache:"no-store",signal:c.signal}).then(function(r){if(!r.ok)throw 0;return r.json();})
.then(function(d){if(!ok(d&&d.url))throw 0;return d.url;}).finally(function(){clearTimeout(t);});}
read(new URL("url.json?cb="+Date.now(),location.href).href)
.catch(function(){return read(api);})
.then(jump)
.catch(function(){if(jump(baked)){msg.textContent="已使用上次保存的网址（可能稍旧）；若打不开，请在电脑上点“重新发布”。";}
else{msg.textContent="暂时取不到最新网址，请稍后重试或在电脑上确认远程访问已开启。";}});
})();
</script>
</body>
</html>
